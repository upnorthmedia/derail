# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
client_id = "<SHOPIFY_API_KEY>"
name = "Geo Gate"
handle = "geo-gate"
application_url = "https://app-production-1a2b.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
scopes = "read_orders,write_shipping,read_customers,write_delivery_customizations"

[auth]
redirect_urls = [
  "https://app-production-1a2b.up.railway.app/auth/callback",
  "https://app-production-1a2b.up.railway.app/auth/shopify/callback",
  "https://app-production-1a2b.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[pos]
embedded = false
