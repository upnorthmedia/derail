# Copy to `.github/dependabot.yml` in the app repo. Keeps the digest-pinned base images in the Dockerfile
# and the actions used by the workflows current, through reviewed pull requests (nothing auto-merges).
#
# docker: reads the `FROM image:tag@sha256:...` lines of the Dockerfile in `directory` (the repo root,
#   where the Dockerfile from assets/docker/ lands). It proposes a new digest when the image behind the tag
#   is rebuilt, and newer tags (for example a new Node major): match those to .nvmrc / engines.node /
#   requires-python before merging. It does not update the `# syntax=` line.
# github-actions: `directory: "/"` makes Dependabot scan .github/workflows.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
