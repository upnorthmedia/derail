# Local guardrails that mirror the CI checks. Install once:
#   pip install pre-commit   (or brew install pre-commit)
#   pre-commit install
# Tools used by the hooks: terraform (or tofu), tflint, trivy, terraform-docs.
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3 # latest release as of 2026-10-20
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL
          - --args=--skip-dirs=**/.terraform
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=false
      # - id: terraform_checkov        # second opinion; slower
      # - id: infracost_breakdown      # needs INFRACOST_API_KEY

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
